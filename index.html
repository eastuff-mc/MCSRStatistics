function renderSeedMatrix(matrix, title = "Seed Performance Matrix", tableId = "seed-matrix-table") {
  const owKeys = Object.keys(matrix).filter(k => k && k !== 'Unknown');
  if (owKeys.length === 0) return '';

  const bastionKeys = Array.from(new Set(owKeys.flatMap(ow => Object.keys(matrix[ow])))).filter(k => k && k !== 'Unknown');
  if (bastionKeys.length === 0) return '';

  const selectedMetric = matrixViewStates[tableId] || 'winrate';
  const splitOptions = [
    `<option value="winrate">Win Rate % (W/L/D)</option>`,
    `<option value="splitconversion">Split Conversion</option>`,
    ...Object.entries(TRACKED_SPLITS).map(([key, label]) => `<option value="${key}">${label} (Median Time)</option>`)
  ].join('');

  return `
    <details id="section-matrix" open>
      <summary style="display:flex; justify-content:space-between; align-items:center; width:100%;">
        <span>${title}</span>
        <select class="matrix-split-select" data-table="${tableId}" style="width:auto; padding:3px 8px; font-size:0.75rem;" onclick="event.stopPropagation()" onchange="updateSeedMatrixView(this)">
          ${splitOptions}
        </select>
      </summary>
      <div class="card-content" style="overflow-x:auto;">
        <table class="matrix-table" id="${tableId}">
          ${generateSeedMatrixTableHTML(matrix, bastionKeys, owKeys, selectedMetric)}
        </table>
      </div>
    </details>
  `;
}

function generateSeedMatrixTableHTML(matrix, bastionKeys, owKeys, selectedMetric) {
  let tableHeader = `<th>Overworld / Bastion</th>` + bastionKeys.map(b => `<th>${b}</th>`).join('');
  let rows = owKeys.map(ow => {
    let cells = bastionKeys.map(b => {
      const cell = matrix[ow]?.[b];
      if (!cell || cell.total === 0) return `<td>-</td>`;

      // Build Visual Funnel for split conversions
      const funnelSteps = Object.entries(TRACKED_SPLITS).map(([splitKey, label]) => {
        const count = cell.splits?.[splitKey]?.length || 0;
        const pct = cell.total > 0 ? ((count / cell.total) * 100).toFixed(0) : 0;
        return `
          <div class="funnel-step">
            <span class="funnel-label" title="${label}">${label}</span>
            <div class="funnel-bar-bg">
              <div class="funnel-bar-fill" style="width: ${pct}%;"></div>
            </div>
            <span class="funnel-val">${pct}% (${count}/${cell.total})</span>
          </div>
        `;
      }).join('');

      const funnelContainer = `<div class="funnel-container">${funnelSteps}</div>`;

      if (selectedMetric === 'winrate') {
        const wr = ((cell.wins / cell.total) * 100).toFixed(0);
        const losses = cell.total - cell.wins - cell.draws;
        return `<td>
          <span class="matrix-cell">${wr}%</span> <br><small style="color:var(--text-muted)">(${cell.wins}W/${losses}L/${cell.draws}D)</small>
        </td>`;
      } else if (selectedMetric === 'splitconversion') {
        return `<td>${funnelContainer}</td>`;
      } else {
        const times = cell.splits?.[selectedMetric] || [];
        if (times.length === 0) return `<td style="color:var(--text-muted)">N/A</td>`;
        const { median } = calculateSplitStats(times);
        const convPct = ((times.length / cell.total) * 100).toFixed(0);
        return `<td>
          <span class="matrix-cell" style="color:var(--color-secondary)">${formatTime(median)}</span><br><small style="color:var(--text-muted)">${convPct}% Conv (${times.length}/${cell.total})</small>
        </td>`;
      }
    }).join('');
    return `<tr><th>${ow}</th>${cells}</tr>`;
  }).join('');

  return `<thead><tr>${tableHeader}</tr></thead><tbody>${rows}</tbody>`;
}

function updateSeedMatrixView(selectElem) {
  if (!currentDataState) return;
  const tableId = selectElem.getAttribute('data-table');
  const selectedMetric = selectElem.value;
  matrixViewStates[tableId] = selectedMetric;
  
  let matrix = currentDataState.stats.seedMatrix;
  if (tableId.includes('opponent') && currentDataState.opponentStats) {
    matrix = currentDataState.opponentStats.seedMatrix;
  }

  const owKeys = Object.keys(matrix).filter(k => k && k !== 'Unknown');
  const bastionKeys = Array.from(new Set(owKeys.flatMap(ow => Object.keys(matrix[ow] || {})))).filter(k => k && k !== 'Unknown');

  const table = document.getElementById(tableId);
  if (table) {
    table.innerHTML = generateSeedMatrixTableHTML(matrix, bastionKeys, owKeys, selectedMetric);
  }
}

function filterDirectMatches(filterVal) {
  directMatchFilter = filterVal;
  saveUiSettings();
  if (currentDataState) {
    const listElem = document.getElementById('direct-matches-container');
    if (listElem) {
      listElem.innerHTML = renderDirectMatchesList(currentDataState.matchesRaw, currentDataState.userData.uuid, currentDataState.opponentData, directMatchFilter);
    }
  }
}

function renderDirectMatchesList(matches, userUuid, opponentData, filterMode = directMatchFilter) {
  if (!matches || matches.length === 0) return '<p style="color:var(--text-muted); font-size:0.85rem;">The player has not played recently.</p>';

  const filteredMatches = matches.filter(m => {
    const isWinner = m.result?.uuid === userUuid;
    const isDraw = !m.result?.uuid;
    const isLoss = m.result?.uuid && m.result?.uuid !== userUuid;

    if (filterMode === 'wins') return isWinner;
    if (filterMode === 'losses') return isLoss;
    if (filterMode === 'draws') return isDraw;
    return true;
  });

  if (filteredMatches.length === 0) {
    return '<p style="color:var(--text-muted); font-size:0.85rem; padding:10px 0;">No matches match the selected filter.</p>';
  }

  const items = filteredMatches.map(m => {
    const isWinner = m.result?.uuid === userUuid;
    const isDraw = !m.result?.uuid;
    const dateStr = new Date(m.date * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const durationStr = formatTime(m.result?.time);

    let resultBadge = `<span class="tag positive">WIN</span>`;
    if (isDraw) resultBadge = `<span class="tag neutral">DRAW</span>`;
    else if (!isWinner) resultBadge = `<span class="tag negative">LOSS</span>`;

    const rawTimelines = Array.isArray(m.timelines) ? m.timelines : [];
    const userTimes = {};
    rawTimelines.filter(t => t && t.uuid === userUuid).forEach(t => { if (t && t.type) userTimes[t.type] = t.time; });

    const splitsFormatted = Object.entries(TRACKED_SPLITS).map(([sKey, sLabel]) => {
      const time = userTimes[sKey];
      return `<div class="match-split-item">
        <span style="color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:4px;">${sLabel}:</span>
        <strong style="color:${time ? 'var(--text-color)' : 'var(--text-muted)'};">${time ? formatTime(time) : '-'}</strong>
      </div>`;
    }).join('');

    const ow = formatName(m.seed?.overworld);
    const bastion = formatName(m.seed?.nether);

    return `
      <div class="match-item">
        <div class="match-header-line">
          <div style="display:flex; align-items:center; gap:8px; justify-content:flex-start;">
            ${resultBadge}
            <span style="color:var(--text-color);">${dateStr}</span>
          </div>
          <div class="match-opp-line">
            <span style="font-size:0.78rem; color:var(--text-muted);">vs</span>
            ${opponentData ? `<img class="player-avatar" style="width:20px; height:20px;" src="https://mc-heads.net/avatar/${opponentData.uuid}/20" alt="${opponentData.nickname}">` : ''}
            <strong style="font-size:0.82rem;">${opponentData ? opponentData.nickname : 'Opponent'}</strong>
          </div>
          <div class="match-seed-info" style="justify-content:flex-end; text-align:right;">
            Duration: <strong style="color:var(--color-secondary);">${durationStr}</strong> ${ow && bastion ? `&bull; Seed: <strong>${ow}</strong> + <strong>${bastion}</strong>` : ''}
          </div>
        </div>
        <div class="match-splits-container">
          ${splitsFormatted}
        </div>
      </div>
    `;
  }).join('');

  return `<div class="match-list">${items}</div>`;
}

function handleCardSortChange(categoryKey, sortValue) {
  if (!cardSortStates[categoryKey]) cardSortStates[categoryKey] = { mode: 'matches', dir: 'desc' };
  cardSortStates[categoryKey].mode = sortValue;
  saveUiSettings();
  updateCardDOM(categoryKey);
}

function toggleCardSortDir(categoryKey) {
  if (!cardSortStates[categoryKey]) cardSortStates[categoryKey] = { mode: 'matches', dir: 'desc' };
  cardSortStates[categoryKey].dir = cardSortStates[categoryKey].dir === 'asc' ? 'desc' : 'asc';

  const btn = document.getElementById(`sort-dir-btn-${categoryKey}`);
  if (btn) btn.innerText = cardSortStates[categoryKey].dir === 'asc' ? 'Asc' : 'Desc';

  saveUiSettings();
  updateCardDOM(categoryKey);
}

function updateCardDOM(categoryKey) {
  if (!currentDataState) return;

  let categoryData = null;
  if (categoryKey === 'overworld' || categoryKey === 'primary_overworld') categoryData = currentDataState.stats.overworld;
  else if (categoryKey === 'bastion' || categoryKey === 'primary_bastion') categoryData = currentDataState.stats.bastion;
  else if (categoryKey === 'combo' || categoryKey === 'primary_combo') categoryData = currentDataState.stats.combo;
  else if (categoryKey === 'opponent_overworld') categoryData = currentDataState.opponentStats?.overworld;
  else if (categoryKey === 'opponent_bastion') categoryData = currentDataState.opponentStats?.bastion;
  else if (categoryKey === 'opponent_combo') categoryData = currentDataState.opponentStats?.combo;

  const isTwoRowMode = !!currentDataState && currentDataState.compareMode === 'compare';

  if (categoryData) {
    const bodyElem = document.getElementById(`card-body-${categoryKey}`);
    if (bodyElem) {
      bodyElem.innerHTML = renderCardContent(categoryData, cardSortStates[categoryKey].mode, cardSortStates[categoryKey].dir, isTwoRowMode);
    }
  }
}

function renderSplitsHTML(splitsObj, total, isTwoRowMode = false) {
  const row1Keys = ['story.enter_the_nether', 'nether.find_bastion', 'nether.loot_bastion', 'nether.find_fortress'];
  const row2Keys = ['projectelo.timeline.blind_travel', 'story.follow_ender_eye', 'story.enter_the_end', 'projectelo.timeline.dragon_death'];

  const getSplitData = (key) => {
    const times = splitsObj[key];
    if (!times || times.length === 0) return null;
    const { mean, median } = calculateSplitStats(times);
    const pct = ((times.length / total) * 100).toFixed(1);
    const count = times.length;
    return {
      name: TRACKED_SPLITS[key],
      median,
      mean,
      pct,
      count,
      total,
      medianStr: formatTime(median),
      meanStr: formatTime(mean)
    };
  };

  const renderGrid = (items) => {
    if (!items || items.length === 0) return '';
    return `<ul class="splits-grid${isTwoRowMode ? ' split-row' : ''}">` + items.map(s => `
      <li>
        <div style="min-width:0;">
          <div class="split-name" title="${s.name}">${s.name}</div>
          <div style="font-size: 0.68rem; color: var(--text-muted); margin-top:1px;">Conv: ${s.pct}% (${s.count}/${s.total})</div>
        </div>
        <div class="split-times">
          <span class="time-val">Med: ${s.medianStr}</span>
          <span class="time-sub">Avg: ${s.meanStr}</span>
        </div>
      </li>
    `).join('') + `</ul>`;
  };

  if (isTwoRowMode) {
    const row1Items = row1Keys.map(k => getSplitData(k)).filter(Boolean);
    const row2Items = row2Keys.map(k => getSplitData(k)).filter(Boolean);

    if (row1Items.length === 0 && row2Items.length === 0) {
      return '<p style="color:var(--text-muted); font-size:0.75rem;">No splits recorded.</p>';
    }

    let html = '';
    if (row1Items.length > 0) html += renderGrid(row1Items);
    if (row2Items.length > 0) html += (html ? '<div style="margin-top:6px;"></div>' : '') + renderGrid(row2Items);
    return html;
  } else {
    const allKeys = Object.keys(splitsObj).filter(k => TRACKED_SPLITS[k]);
    const items = allKeys.map(k => getSplitData(k)).filter(Boolean).sort((a, b) => a.median - b.median);
    if (items.length === 0) return '<p style="color:var(--text-muted); font-size:0.75rem;">No splits recorded.</p>';
    return renderGrid(items);
  }
}

function renderCardContent(categoryData, sortMode = 'matches', sortDir = 'desc', isTwoRowMode = false) {
  let entries = Object.entries(categoryData).filter(([name]) => name && name !== 'Unknown');

  entries.sort((a, b) => {
    const dA = a[1], dB = b[1];
    let res = 0;
    if (sortMode === 'winrate') res = (dB.wins / dB.total) - (dA.wins / dA.total);
    else if (sortMode === 'elo') res = dB.elo - dA.elo;
    else res = dB.total - dA.total;

    return sortDir === 'asc' ? -res : res;
  });

  let content = '';
  entries.forEach(([name, d]) => {
    const losses = d.total - d.wins - d.draws;
    const wrVal = (d.wins / d.total) * 100;
    const wr = wrVal.toFixed(1);
    const eloTag = d.elo >= 0 
      ? `<span class="tag positive">+${d.elo} ELO</span>` 
      : `<span class="tag negative">${d.elo} ELO</span>`;
    
    content += `
      <div class="stat-row">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; width:100%; gap:14px; flex-wrap:wrap;">
          <div class="stat-main">
            <div class="stat-title">${name}</div>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" style="width: ${wr}%;"></div>
            </div>
            <div class="stat-sub">
              ${d.wins} W / ${losses} L / ${d.draws} D (${wr}% WR) &bull; Nether: ${((d.nether/d.total)*100).toFixed(1)}% &bull; End: ${((d.end/d.total)*100).toFixed(1)}%
            </div>
          </div>
          <div class="tag-container">
            ${eloTag}
            <span class="tag neutral">${d.total} Matches</span>
          </div>
        </div>
        <div style="width:100%;">
          ${renderSplitsHTML(d.splits, d.total, isTwoRowMode)}
        </div>
      </div>`;
  });

  return content || '<p style="color:var(--text-muted); font-size:0.8rem;">No data available.</p>';
}

function renderCard(title, categoryData, categoryKey = null, isTwoRowMode = false, elementId = "") {
  const state = cardSortStates[categoryKey] || { mode: 'matches', dir: 'desc' };

  let sortControls = '';
  if (categoryKey) {
    sortControls = `
      <div class="sort-controls-wrapper" onclick="event.stopPropagation()">
        <select class="card-sort-select" onchange="handleCardSortChange('${categoryKey}', this.value)" style="width: auto; padding: 3px 8px; font-size: 0.76rem;">
          <option value="matches" ${state.mode === 'matches' ? 'selected' : ''}>Most Matches</option>
          <option value="winrate" ${state.mode === 'winrate' ? 'selected' : ''}>Win Rate %</option>
          <option value="elo" ${state.mode === 'elo' ? 'selected' : ''}>Net ELO Gain</option>
        </select>
        <button id="sort-dir-btn-${categoryKey}" class="btn-secondary" style="padding:2px 8px; font-size:0.72rem;" onclick="toggleCardSortDir('${categoryKey}')" title="Flip Filter Direction">
          ${state.dir === 'asc' ? 'Asc' : 'Desc'}
        </button>
      </div>
    `;
  }

  return `
    <details ${elementId ? `id="${elementId}"` : ''} open>
      <summary style="display:flex; justify-content:space-between; align-items:center;">
        <span>${title}</span>
        ${sortControls}
      </summary>
      <div class="card-content" id="card-body-${categoryKey}">
        ${renderCardContent(categoryData, state.mode, state.dir, isTwoRowMode)}
      </div>
    </details>`;
}

function exportSummary() {
  if (!currentDataState) return;
  const { userData, stats, matchCount } = currentDataState;
  const overall = stats.overall.all;
  const losses = overall.total - overall.wins - overall.draws;
  const wr = ((overall.wins / overall.total) * 100).toFixed(1);
  const txt = `MCSR Ranked Analytics Summary for ${userData.nickname}:
Matches: ${matchCount}
Record: ${overall.wins}W / ${losses}L / ${overall.draws}D (${wr}% WR)
Net ELO Change: ${overall.elo >= 0 ? '+' : ''}${overall.elo}`;
  navigator.clipboard.writeText(txt).then(() => {
    showStatus("Summary copied to clipboard!", "info");
  });
}

function exportCSV() {
  if (!currentDataState) return;
  const { stats, userData } = currentDataState;
  let csv = "Match,Date,ELO,Change,Winner,Opponent\n";
  stats.eloHistory.forEach(h => {
    csv += `${h.matchIndex},"${new Date(h.date*1000).toISOString()}",${h.elo},${h.change},"${h.winnerName}","${h.opponentName}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${userData.nickname}_mcsr_stats.csv`;
  a.click();
}

function exportJSON() {
  if (!currentDataState) return;
  const jsonStr = JSON.stringify(currentDataState, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentDataState.userData.nickname}_mcsr_stats.json`;
  a.click();
}

function updateNavigation() {
  const navOverall = document.getElementById('nav-overall-comparison');
  const navDirect = document.getElementById('nav-direct-matches');
  const state = currentDataState;
  const showCompare = !!(state && state.opponentData && state.opponentStats && state.compareMode === 'compare');
  const showDirect = !!(state && state.opponentData && state.compareMode === 'direct');
  if (navOverall) navOverall.style.display = showCompare ? '' : 'none';
  if (navDirect) navDirect.style.display = showDirect ? '' : 'none';
}

function renderResults() {
  if (!currentDataState) return;
  updateNavigation();
  const { userData, stats, matchesRaw, matchCount, opponentData, opponentStats, opponentName, opponentUuid, compareMode } = currentDataState;
  const container = document.getElementById('results-area');
  container.innerHTML = '';

  const overall = stats.overall.all;
  const losses = overall.total - overall.wins - overall.draws;
  const wr = ((overall.wins / overall.total) * 100).toFixed(1);
  const streakText = stats.streaks.current > 0 ? `+${stats.streaks.current} W` : (stats.streaks.current < 0 ? `${stats.streaks.current} L` : `0`);

  let headerCard = '';
  if (opponentData) {
    headerCard = `
      <div id="section-overview" class="player-header-card">
        <div class="compare-vs-header">
          <div class="compare-player-side">
            <img class="player-avatar" src="https://mc-heads.net/avatar/${userData.uuid}/38" alt="${userData.nickname}">
            <div style="min-width:0;">
              <div class="player-name">${userData.nickname}</div>
              <div style="font-size: 0.78rem; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${overall.wins}W / ${losses}L / ${overall.draws}D (${wr}% WR)</div>
            </div>
          </div>
          <div class="compare-vs-badge">VS</div>
          <div class="compare-player-side right">
            <div style="min-width:0;">
              <div class="player-name">${opponentData.nickname}</div>
              <div style="font-size: 0.78rem; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${opponentStats ? `${opponentStats.overall.all.wins}W / ${opponentStats.overall.all.total - opponentStats.overall.all.wins - opponentStats.overall.all.draws}L / ${opponentStats.overall.all.draws}D` : 'Opponent'}
              </div>
            </div>
            <img class="player-avatar" src="https://mc-heads.net/avatar/${opponentData.uuid}/38" alt="${opponentData.nickname}">
          </div>
        </div>
      </div>
    `;
  } else {
    headerCard = `
      <div id="section-overview" class="player-header-card">
        <div class="player-info">
          <img class="player-avatar" src="https://mc-heads.net/avatar/${userData.uuid}/38" alt="${userData.nickname}">
          <div style="min-width:0;">
            <div class="player-name">${userData.nickname}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${overall.wins}W / ${losses}L / ${overall.draws}D (${wr}% Win Rate) &bull; ${overall.elo >= 0 ? '+' : ''}${overall.elo} ELO Gain</div>
          </div>
        </div>
        <div class="export-actions">
          <button class="btn-secondary" onclick="exportSummary()">Copy Summary</button>
          <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
          <button class="btn-secondary" onclick="exportJSON()">Export JSON</button>
        </div>
      </div>
    `;
  }

  const metricsRow = `
    <div class="metrics-summary-grid">
      <div class="metric-box">
        <div class="metric-lbl">Matches</div>
        <div class="metric-val">${matchCount}</div>
      </div>
      <div class="metric-box secondary">
        <div class="metric-lbl">Win Rate</div>
        <div class="metric-val">${wr}%</div>
      </div>
      <div class="metric-box tertiary">
        <div class="metric-lbl">Current Streak</div>
        <div class="metric-val">${streakText}</div>
      </div>
      <div class="metric-box quaternary">
        <div class="metric-lbl">Best Streak</div>
        <div class="metric-val">${stats.streaks.maxWin}W</div>
      </div>
    </div>
  `;

  let sideBySideCard = '';
  if (opponentData && opponentStats && compareMode === 'compare') {
    const oppO = opponentStats.overall.all;
    const oppLosses = oppO.total - oppO.wins - oppO.draws;
    const oppWr = ((oppO.wins / oppO.total) * 100).toFixed(1);
    sideBySideCard = `
      <details id="section-overall-comparison" open>
        <summary>Overall Comparison</summary>
        <div class="card-content">
          <div class="compare-grid">
            <div class="compare-card">
              <div class="compare-title">
                <img class="player-avatar" style="width:24px; height:24px;" src="https://mc-heads.net/avatar/${userData.uuid}/24" alt="${userData.nickname}">
                <span style="overflow:hidden; text-overflow:ellipsis;">${userData.nickname}</span>
              </div>
              <p style="padding:2px 0;"><strong>Matches:</strong> ${overall.total}</p>
              <p style="padding:2px 0;"><strong>Record:</strong> ${overall.wins}W / ${losses}L / ${overall.draws}D</p>
              <p style="padding:2px 0;"><strong>Win Rate:</strong> ${wr}%</p>
              <p style="padding:2px 0;"><strong>ELO Gain:</strong> ${overall.elo >= 0 ? '+' : ''}${overall.elo}</p>
              <p style="padding:2px 0;"><strong>Current Streak:</strong> ${streakText}</p>
              <p style="padding:2px 0;"><strong>Max Streak:</strong> ${stats.streaks.maxWin}W</p>
            </div>
            <div class="compare-card secondary">
              <div class="compare-title">
                <img class="player-avatar" style="width:24px; height:24px;" src="https://mc-heads.net/avatar/${opponentData.uuid}/24" alt="${opponentData.nickname}">
                <span style="overflow:hidden; text-overflow:ellipsis;">${opponentData.nickname}</span>
              </div>
              <p style="padding:2px 0;"><strong>Matches:</strong> ${oppO.total}</p>
              <p style="padding:2px 0;"><strong>Record:</strong> ${oppO.wins}W / ${oppLosses}L / ${oppO.draws}D</p>
              <p style="padding:2px 0;"><strong>Win Rate:</strong> ${oppWr}%</p>
              <p style="padding:2px 0;"><strong>ELO Gain:</strong> ${oppO.elo >= 0 ? '+' : ''}${oppO.elo}</p>
              <p style="padding:2px 0;"><strong>Current Streak:</strong> ${opponentStats.streaks.current > 0 ? `+${opponentStats.streaks.current} W` : (opponentStats.streaks.current < 0 ? `${opponentStats.streaks.current} L` : '0')}</p>
              <p style="padding:2px 0;"><strong>Max Streak:</strong> ${opponentStats.streaks.maxWin}W</p>
            </div>
          </div>
        </div>
      </details>
    `;
  }

  const chartHTML = renderEloChart(stats.eloHistory, opponentStats ? opponentStats.eloHistory : null, userData.nickname, opponentData ? opponentData.nickname : 'Opponent', true);

  // Render Seed Matrix first, then Structure Breakdown Cards
  const matrixHTML = renderSeedMatrix(stats.seedMatrix, "Seed Performance Matrix", "seed-matrix-table");

  let bodyHTML = '';
  if (opponentData && opponentStats && compareMode === 'compare') {
    bodyHTML = `
      ${headerCard}
      ${sideBySideCard}
      ${chartHTML}
      ${matrixHTML}
      ${renderCard(`${userData.nickname} - Overworld Structures`, stats.overworld, 'primary_overworld', true, 'section-overworld')}
      ${renderCard(`${opponentData.nickname} - Overworld Structures`, opponentStats.overworld, 'opponent_overworld', true)}
      ${renderCard(`${userData.nickname} - Bastion Structures`, stats.bastion, 'primary_bastion', true, 'section-bastion')}
      ${renderCard(`${opponentData.nickname} - Bastion Structures`, opponentStats.bastion, 'opponent_bastion', true)}
      ${renderCard(`${userData.nickname} - Seed Combinations`, stats.combo, 'primary_combo', true, 'section-combos')}
      ${renderCard(`${opponentData.nickname} - Seed Combinations`, opponentStats.combo, 'opponent_combo', true)}
    `;
  } else {
    bodyHTML = `
      ${headerCard}
      ${metricsRow}
      ${chartHTML}
      ${matrixHTML}
      ${renderCard("Overworld Structures", stats.overworld, 'overworld', true, 'section-overworld')}
      ${renderCard("Bastion Structures", stats.bastion, 'bastion', true, 'section-bastion')}
      ${renderCard("Seed Combinations", stats.combo, 'combo', true, 'section-combos')}
    `;
  }

  if (opponentData && compareMode === 'direct') {
    bodyHTML += `
      <details id="section-direct-matches" open>
        <summary style="display:flex; justify-content:space-between; align-items:center;">
          <span>Direct 1v1 Matches vs ${opponentData.nickname}</span>
          <div class="sort-controls-wrapper" onclick="event.stopPropagation()">
            <select onchange="filterDirectMatches(this.value)" style="width: auto; padding: 3px 8px; font-size: 0.76rem;">
              <option value="all" ${directMatchFilter === 'all' ? 'selected' : ''}>All Matches</option>
              <option value="wins" ${directMatchFilter === 'wins' ? 'selected' : ''}>Wins Only</option>
              <option value="losses" ${directMatchFilter === 'losses' ? 'selected' : ''}>Losses Only</option>
              <option value="draws" ${directMatchFilter === 'draws' ? 'selected' : ''}>Draws Only</option>
            </select>
          </div>
        </summary>
        <div class="card-content" id="direct-matches-container">
          ${renderDirectMatchesList(matchesRaw, userData.uuid, opponentData, directMatchFilter)}
        </div>
      </details>
    `;
  }

  container.innerHTML = bodyHTML;
}
// Initialize persisted UI state immediately on page load.
restoreUiSettings();
changeTheme(document.getElementById('theme-select').value);
cleanRequestLogs();
toggleFilterInput();
handleOpponentInput();
renderRecentChips();
updateNavigation();

</script>
</body>
</html>
