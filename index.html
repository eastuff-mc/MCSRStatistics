<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCSR Ranked Analytics Pro</title>
  <style>
    :root[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --border-color: #475569;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --header-bg: #0f172a;
      --badge-bg: #334155;
      --bar-bg: #334155;

      --color-primary: #6366f1;   /* Indigo */
      --color-secondary: #0ea5e9; /* Sky Blue */
      --color-tertiary: #10b981;  /* Emerald */
      --color-quaternary: #f59e0b;/* Amber */
      --color-quinary: #ec4899;   /* Pink */

      --grid-line: rgba(148, 163, 184, 0.12);
      --axis-text: #94a3b8;
    }

    :root[data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #dc2626;
      --header-bg: #ffffff;
      --badge-bg: #e2e8f0;
      --bar-bg: #e2e8f0;

      --color-primary: #4f46e5;
      --color-secondary: #0284c7;
      --color-tertiary: #059669;
      --color-quaternary: #d97706;
      --color-quinary: #db2777;

      --grid-line: rgba(100, 116, 139, 0.15);
      --axis-text: #64748b;
    }

    :root[data-theme="nether"] {
      --bg-color: #0f0a0a;
      --card-bg: #1a0f0f;
      --card-hover: #261515;
      --border-color: #3d1c1c;
      --text-color: #fecaca;
      --text-muted: #f87171;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --danger: #ef4444;
      --header-bg: #140c0c;
      --badge-bg: #2d1414;
      --bar-bg: #281212;

      --color-primary: #ef4444;
      --color-secondary: #f97316;
      --color-tertiary: #f59e0b;
      --color-quaternary: #b91c1c;
      --color-quinary: #fb7185;

      --grid-line: rgba(248, 113, 113, 0.15);
      --axis-text: #f87171;
    }

    :root[data-theme="end"] {
      --bg-color: #0d0914;
      --card-bg: #161024;
      --card-hover: #201735;
      --border-color: #2d1d47;
      --text-color: #f3e8ff;
      --text-muted: #c084fc;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --danger: #f43f5e;
      --header-bg: #120c1e;
      --badge-bg: #23163a;
      --bar-bg: #221438;

      --color-primary: #a855f7;
      --color-secondary: #38bdf8;
      --color-tertiary: #c084fc;
      --color-quaternary: #e879f9;
      --color-quinary: #818cf8;

      --grid-line: rgba(192, 132, 252, 0.15);
      --axis-text: #c084fc;
    }

    :root[data-theme="overworld"] {
      --bg-color: #0d1a0e;
      --card-bg: #152617;
      --card-hover: #1e3621;
      --border-color: #2a4a2e;
      --text-color: #e2f7e5;
      --text-muted: #86efac;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --danger: #ef4444;
      --header-bg: #112113;
      --badge-bg: #1f3a23;
      --bar-bg: #19301c;

      --color-primary: #22c55e;
      --color-secondary: #06b6d4;
      --color-tertiary: #84cc16;
      --color-quaternary: #eab308;
      --color-quinary: #10b981;

      --grid-line: rgba(134, 239, 172, 0.15);
      --axis-text: #86efac;
    }

    :root[data-theme="sunset"] {
      --bg-color: #140b18;
      --card-bg: #211227;
      --card-hover: #2e1a37;
      --border-color: #452652;
      --text-color: #fde8ff;
      --text-muted: #f0abfc;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --danger: #f43f5e;
      --header-bg: #1a0e20;
      --badge-bg: #321c3b;
      --bar-bg: #291731;

      --color-primary: #f97316;
      --color-secondary: #ec4899;
      --color-tertiary: #8b5cf6;
      --color-quaternary: #f59e0b;
      --color-quinary: #f43f5e;

      --grid-line: rgba(240, 171, 252, 0.15);
      --axis-text: #f0abfc;
    }

    :root[data-theme="ocean"] {
      --bg-color: #0a111a;
      --card-bg: #111c2b;
      --card-hover: #18273c;
      --border-color: #243b59;
      --text-color: #e0f2fe;
      --text-muted: #7dd3fc;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --danger: #f43f5e;
      --header-bg: #0e1724;
      --badge-bg: #1a2c43;
      --bar-bg: #152336;

      --color-primary: #06b6d4;
      --color-secondary: #3b82f6;
      --color-tertiary: #10b981;
      --color-quaternary: #6366f1;
      --color-quinary: #0284c7;

      --grid-line: rgba(125, 211, 252, 0.15);
      --axis-text: #7dd3fc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 14px; transition: background-color 0.25s, color 0.25s; word-wrap: break-word; overflow-x: hidden; }
    
    .layout-wrapper { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: flex-start; }
    .container { flex: 1; min-width: 0; order: 1; }
    .sticky-nav { order: 2; }

    /* Sticky Side Navigation Helper */
    .sticky-nav {
      position: sticky;
      top: 20px;
      height: fit-content;
      width: 200px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .sticky-nav-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }
    .sticky-nav a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .sticky-nav a:hover {
      background: var(--card-hover);
      color: var(--color-primary);
    }

    @media (max-width: 1024px) {
      .layout-wrapper { flex-direction: column; }
      .sticky-nav { width: 100%; position: static; flex-direction: row; flex-wrap: wrap; }
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px; }
    .title-group { display: flex; align-items: baseline; gap: 10px; }
    h1 { font-size: 1.5rem; font-weight: 800; color: var(--color-primary); letter-spacing: -0.5px; }
    .author-tag { font-size: 0.76rem; color: var(--text-muted); font-weight: 500; }

    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .scan-info-badge, .rate-limit-badge { font-size: 0.75rem; background: var(--badge-bg); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-color); color: var(--text-muted); font-weight: 500; white-space: nowrap; }

    .controls-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .primary-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 12px; align-items: end; }

    @media (max-width: 900px) { .primary-form { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .primary-form { grid-template-columns: 1fr; } }

    .field-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field-group.hidden-group { visibility: hidden; pointer-events: none; }
    label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    input, select, button { width: 100%; padding: 8px 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-size: 0.85rem; outline: none; transition: border-color 0.2s; text-overflow: ellipsis; }
    input:focus, select:focus { border-color: var(--color-primary); }

    .quick-bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .recent-content { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
    .recent-spacer { flex: 1; min-width: 12px; }
    .clear-input-btn { flex: 0 0 auto; width: auto; padding: 4px 10px; font-size: 0.74rem; }
    .quick-title { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-right: 4px; }
    .chip { background: var(--badge-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 3px 10px; font-size: 0.74rem; cursor: pointer; color: var(--text-color); transition: all 0.2s; white-space: nowrap; }
    .chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #ffffff; }

    .advanced-slate { margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 10px; }
    
    .adv-settings-toggle {
      font-weight: 400;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      padding: 0;
      width: auto;
    }
    .adv-settings-toggle:hover { color: var(--color-primary); }
    .adv-settings-toggle::after {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      transform: rotate(45deg);
      transition: transform 0.2s ease;
      margin-left: 2px;
    }
    .adv-settings-toggle.open::after { transform: rotate(-135deg); }

    .adv-panel-content { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
    .adv-panel-content.open { display: block; }

    .advanced-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .panel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    button.btn-primary { background-color: var(--color-primary); color: #ffffff; font-weight: 600; cursor: pointer; border: none; padding: 8px 14px; border-radius: 8px; transition: background-color 0.2s, transform 0.1s; width: auto; white-space: nowrap; }
    button.btn-primary:hover { background-color: var(--accent-hover); }
    button.btn-primary:active { transform: scale(0.98); }
    button.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-secondary { background-color: var(--badge-bg); color: var(--text-color); border: 1px solid var(--border-color); font-size: 0.8rem; padding: 6px 12px; width: auto; font-weight: 500; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    button.btn-secondary:hover { background-color: var(--card-hover); }

    .status-msg { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; display: none; font-weight: 500; }
    .status-msg.error { background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger); color: var(--danger); display: block; }
    .status-msg.info { background: rgba(99, 102, 241, 0.12); border: 1px solid var(--color-primary); color: var(--color-primary); display: block; }

    .player-header-card { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .player-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .player-avatar { width: 38px; height: 38px; border-radius: 6px; background: var(--badge-bg); border: 1px solid var(--border-color); object-fit: cover; flex-shrink: 0; }
    .player-name { font-size: 1.15rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .export-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .compare-vs-header { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 12px; flex-wrap: wrap; }
    .compare-player-side { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
    .compare-player-side.right { justify-content: flex-end; text-align: right; }
    .compare-vs-badge { font-size: 0.95rem; font-weight: 900; color: var(--color-primary); background: var(--badge-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 16px; }

    .metrics-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .metric-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; text-align: center; border-top: 3px solid var(--color-primary); }
    .metric-box.secondary { border-top-color: var(--color-secondary); }
    .metric-box.tertiary { border-top-color: var(--color-tertiary); }
    .metric-box.quaternary { border-top-color: var(--color-quaternary); }

    .metric-val { font-size: 1.25rem; font-weight: 800; color: var(--text-color); margin-top: 2px; }
    .metric-lbl { font-size: 0.68rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

    /* Enhanced Graph UI Styles */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chart-legend {
      display: flex;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      flex-wrap: wrap;
    }
    .legend-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    
    .graph-container {
      width: 100%;
      aspect-ratio: 600 / 220;
      position: relative;
      cursor: crosshair;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 10px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    svg.elo-chart { width: 100%; height: 100%; display: block; overflow: visible; }
    .graph-grid line { stroke: var(--grid-line); stroke-dasharray: 4 4; }
    .graph-axis text { fill: var(--axis-text); font-size: 11px; text-anchor: end; font-family: sans-serif; font-weight: 500; }
    .graph-axis-x text { text-anchor: middle; font-size: 11px; }
    .rank-line { stroke-dasharray: 2 3; opacity: 0.45; stroke-width: 1; }
    .rank-text { font-size: 9px; font-weight: 700; opacity: 0.8; text-anchor: start; }
    .axis-bar { stroke: var(--border-color); stroke-width: 2; stroke-linecap: round; }
    
    polyline.chart-line {
      fill: none;
      stroke: var(--color-primary);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 2px 4px rgba(99, 102, 241, 0.35));
    }
    polyline.chart-line.secondary-line {
      stroke: var(--color-secondary);
      stroke-width: 2.2;
      filter: drop-shadow(0px 2px 4px rgba(14, 165, 233, 0.35));
    }
    polygon.chart-area {
      fill: url(#primary-gradient);
      opacity: 0.18;
      pointer-events: none;
    }
    polygon.chart-area.secondary-area {
      fill: url(#secondary-gradient);
      opacity: 0.15;
      pointer-events: none;
    }

    .hover-line {
      stroke: var(--text-muted);
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
      pointer-events: none;
      opacity: 0.75;
    }
    .hover-dot {
      fill: var(--card-bg);
      stroke-width: 3;
      pointer-events: none;
      transition: r 0.15s ease;
    }
    .hover-dot.primary {
      stroke: var(--color-primary);
      filter: drop-shadow(0 0 6px var(--color-primary));
    }
    .hover-dot.secondary {
      stroke: var(--color-secondary);
      filter: drop-shadow(0 0 6px var(--color-secondary));
    }

    .chart-tooltip {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: var(--text-color);
      pointer-events: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      z-index: 10;
      display: none;
      max-width: 310px;
      line-height: 1.45;
      backdrop-filter: blur(12px);
    }

    details { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    summary { padding: 12px 16px; font-weight: 700; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); font-size: 0.9rem; gap: 8px; flex-wrap: wrap; }
    summary:hover { background: var(--card-hover); }

    .card-content { padding: 14px 18px; border-top: 1px solid var(--border-color); }
    .stat-row { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    .stat-row:last-child { border-bottom: none; }

    .stat-main { flex: 1; min-width: 200px; }
    .stat-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .stat-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }

    .progress-bar-container { width: 100%; height: 5px; background: var(--bar-bg); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { height: 100%; background: var(--color-primary); border-radius: 3px; transition: width 0.4s ease; }

    .tag-container { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag { padding: 3px 8px; border-radius: 5px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
    .tag.positive { background: rgba(16, 185, 129, 0.18); color: var(--color-tertiary); }
    .tag.negative { background: rgba(239, 68, 68, 0.18); color: var(--danger); }
    .tag.neutral { background: var(--badge-bg); color: var(--text-muted); border: 1px solid var(--border-color); }

    /* Visual Funnel Styles for Matrix Container Split Conversions */
    .funnel-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
      background: var(--badge-bg);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .funnel-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
    }
    .funnel-label { width: 90px; text-align: right; color: var(--text-muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .funnel-bar-bg { flex: 1; height: 12px; background: var(--bg-color); border-radius: 3px; overflow: hidden; position: relative; }
    .funnel-bar-fill { height: 100%; background: var(--color-secondary); border-radius: 3px; transition: width 0.3s ease; }
    .funnel-val { width: 85px; font-weight: 700; color: var(--text-color); font-size: 0.68rem; }

    /* Splits grouped into clean equal dynamic grid rows */
    ul.splits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      list-style: none;
      align-items: stretch;
      width: 100%;
    }
    ul.splits-grid.split-row {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    @media (max-width: 900px) {
      ul.splits-grid.split-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      ul.splits-grid.split-row { grid-template-columns: 1fr; }
    }

    ul.splits-grid li {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      min-width: 0;
    }
    .split-name { font-weight: 700; color: var(--text-color); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .split-times { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; }
    .time-val { font-weight: 700; color: var(--color-secondary); font-size: 0.78rem; }
    .time-sub { font-size: 0.68rem; color: var(--text-muted); }

<script>
const BASE_URL = 'https://api.mcsrranked.com';
const TRACKED_SPLITS = {
  'story.enter_the_nether': 'Nether Enter',
  'nether.find_bastion': 'Bastion Enter',
  'nether.loot_bastion': 'Bastion Exit',
  'nether.find_fortress': 'Fortress Enter',
  'projectelo.timeline.blind_travel': 'Blind',
  'story.follow_ender_eye': 'Stronghold Enter',
  'story.enter_the_end': 'End Enter',
  'projectelo.timeline.dragon_death': 'Finish'
};

const MAX_MATCHES = 400;
const API_WINDOW_LIMIT = 500;
const API_SAFETY_RESERVE = 10;
const SETTINGS_KEY = 'mcsr_ui_settings_v2';

function loadUiSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch (_) { return {}; }
}

function saveUiSettings() {
  const payload = {
    filterMode: document.getElementById('filter-mode')?.value || 'matches',
    filterVal: document.getElementById('filter-val')?.value || '50',
    compareMode: document.getElementById('compare-mode')?.value || 'direct',
    theme: document.getElementById('theme-select')?.value || 'dark',
    directMatchFilter,
    matrixViewStates,
    cardSortStates
  };
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
}

function restoreUiSettings() {
  const saved = loadUiSettings();
  if (saved.filterMode && ['matches','days','all'].includes(saved.filterMode)) document.getElementById('filter-mode').value = saved.filterMode;
  if (saved.filterVal != null) document.getElementById('filter-val').value = saved.filterVal;
  if (saved.compareMode && ['direct','compare'].includes(saved.compareMode)) document.getElementById('compare-mode').value = saved.compareMode;
  if (saved.theme) {
    const themeSelect = document.getElementById('theme-select');
    if (themeSelect && [...themeSelect.options].some(o => o.value === saved.theme)) themeSelect.value = saved.theme;
  }
  if (saved.directMatchFilter && ['all','wins','losses','draws'].includes(saved.directMatchFilter)) directMatchFilter = saved.directMatchFilter;
  if (saved.matrixViewStates && typeof saved.matrixViewStates === 'object') matrixViewStates = { ...matrixViewStates, ...saved.matrixViewStates };
  if (saved.cardSortStates && typeof saved.cardSortStates === 'object') {
    Object.keys(cardSortStates).forEach(k => { if (saved.cardSortStates[k]) cardSortStates[k] = { ...cardSortStates[k] }; });
  }
}

function resetUiSettings() {
  localStorage.removeItem(SETTINGS_KEY);
  directMatchFilter = 'all';
  matrixViewStates = { 'seed-matrix-table': 'winrate', 'opponent-seed-matrix-table': 'winrate' };
  Object.keys(cardSortStates).forEach(k => { cardSortStates[k] = { mode: 'matches', dir: 'desc' }; });
  document.getElementById('filter-mode').value = 'matches';
  document.getElementById('filter-val').value = '50';
  document.getElementById('compare-mode').value = 'direct';
  document.getElementById('theme-select').value = 'dark';
  changeTheme('dark');
  handleOpponentInput();
  toggleFilterInput();
  saveUiSettings();
  if (currentDataState) renderResults();
}

const MCSR_RANKS = [
  { name: 'Coal I', min: 0, color: '#6b7280' },
  { name: 'Coal II', min: 200, color: '#6b7280' },
  { name: 'Coal III', min: 400, color: '#6b7280' },
  { name: 'Iron I', min: 600, color: '#9ca3af' },
  { name: 'Iron II', min: 700, color: '#9ca3af' },
  { name: 'Iron III', min: 800, color: '#9ca3af' },
  { name: 'Gold I', min: 900, color: '#f59e0b' },
  { name: 'Gold II', min: 1000, color: '#f59e0b' },
  { name: 'Gold III', min: 1100, color: '#f59e0b' },
  { name: 'Emerald I', min: 1200, color: '#10b981' },
  { name: 'Emerald II', min: 1300, color: '#10b981' },
  { name: 'Emerald III', min: 1400, color: '#10b981' },
  { name: 'Diamond I', min: 1500, color: '#06b6d4' },
  { name: 'Diamond II', min: 1666, color: '#06b6d4' },
  { name: 'Diamond III', min: 1833, color: '#06b6d4' },
  { name: 'Netherite', min: 2000, color: '#a855f7' }
];

let activeInputId = 'username';
let requestTimestamps = JSON.parse(localStorage.getItem('mcsr_req_logs') || '[]');
let recentSearches = JSON.parse(localStorage.getItem('mcsr_recent_players') || '[]');
let currentDataState = null;
let db = null;

let tempAdvancedState = null;
let directMatchFilter = 'all';
let matrixViewStates = {
  'seed-matrix-table': 'winrate',
  'opponent-seed-matrix-table': 'winrate'
};

// Card sorting configurations (mode & direction)
const cardSortStates = {
  overworld: { mode: 'matches', dir: 'desc' },
  bastion: { mode: 'matches', dir: 'desc' },
  combo: { mode: 'matches', dir: 'desc' },
  primary_overworld: { mode: 'matches', dir: 'desc' },
  primary_bastion: { mode: 'matches', dir: 'desc' },
  primary_combo: { mode: 'matches', dir: 'desc' },
  opponent_overworld: { mode: 'matches', dir: 'desc' },
  opponent_bastion: { mode: 'matches', dir: 'desc' },
  opponent_combo: { mode: 'matches', dir: 'desc' }
};

const dbReq = indexedDB.open('MCSR_Analytics_DB', 1);
dbReq.onupgradeneeded = (e) => {
  const database = e.target.result;
  if (!database.objectStoreNames.contains('matches')) {
    database.createObjectStore('matches', { keyPath: 'id' });
  }
};
dbReq.onsuccess = (e) => { db = e.target.result; };

function getCachedMatchDB(id) {
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    const tx = db.transaction('matches', 'readonly');
    const store = tx.objectStore('matches');
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result ? req.result.data : null);
    req.onerror = () => resolve(null);
  });
}

function saveCachedMatchDB(id, data) {
  if (!db) return;
  const tx = db.transaction('matches', 'readwrite');
  const store = tx.objectStore('matches');
  store.put({ id, data, cachedAt: Date.now() });
}

function cleanRequestLogs() {
  const tenMinsAgo = Date.now() - 10 * 60 * 1000;
  requestTimestamps = requestTimestamps.filter(t => t > tenMinsAgo);
  localStorage.setItem('mcsr_req_logs', JSON.stringify(requestTimestamps));
  document.getElementById('rate-badge').innerText = `API Usage: ${requestTimestamps.length}/${API_WINDOW_LIMIT}`;
  const badge = document.getElementById('rate-badge');
  if (badge) badge.title = `${API_WINDOW_LIMIT - requestTimestamps.length} API requests remaining in the current 10-minute window.`;
}

function trackRequest(count = 1) {
  const now = Date.now();
  for (let i = 0; i < count; i++) requestTimestamps.push(now);
  cleanRequestLogs();
}

function changeTheme(theme) {
  if (theme === 'cyberpunk') theme = 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('mcsr_theme', theme);
  if (document.readyState !== 'loading') saveUiSettings();
}

const savedTheme = localStorage.getItem('mcsr_theme');
if (savedTheme && savedTheme !== 'cyberpunk') {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-select').value = savedTheme;
}

function updateRecentSearches(name) {
  if (!name) return;
  recentSearches = [name, ...recentSearches.filter(n => n.toLowerCase() !== name.toLowerCase())].slice(0, 5);
  localStorage.setItem('mcsr_recent_players', JSON.stringify(recentSearches));
  renderRecentChips();
}

function renderRecentChips() {
  const container = document.getElementById('recent-container');
  const chipsArea = document.getElementById('recent-chips');
  if (!recentSearches || recentSearches.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';
  const targetId = activeInputId || 'username';
  const currentInput = document.getElementById(targetId).value.toLowerCase();
  chipsArea.innerHTML = recentSearches.map(name => `
    <span class="chip ${currentInput === name.toLowerCase() ? 'active' : ''}" onclick="quickSearch('${name}')">${name}</span>
  `).join('');
}

function quickSearch(name) {
  const targetId = (activeInputId && document.getElementById(activeInputId)) ? activeInputId : 'username';
  document.getElementById(targetId).value = name;
  handleOpponentInput();
  renderRecentChips();
  runAnalysis(false);
}

function clearActiveInput() {
  const targetId = (activeInputId && document.getElementById(activeInputId)) ? activeInputId : 'username';
  const input = document.getElementById(targetId);
  if (!input) return;
  input.value = '';
  input.focus();
  handleOpponentInput();
  renderRecentChips();
}

function handleCompareModeChange() {
  const compareMode = document.getElementById('compare-mode').value;
  const filterModeSelect = document.getElementById('filter-mode');
  const matchesOpt = filterModeSelect.querySelector('option[value="matches"]');

  if (compareMode === 'compare') {
    if (matchesOpt) matchesOpt.disabled = true;
    if (filterModeSelect.value === 'matches') {
      filterModeSelect.value = 'days';
      toggleFilterInput();
    }
  } else {
    if (matchesOpt) matchesOpt.disabled = false;
  }
  saveUiSettings();
}

function handleOpponentInput() {
  const opponentName = document.getElementById('opponent').value.trim();
  const compareGroup = document.getElementById('compare-mode-group');
  const compareModeSelect = document.getElementById('compare-mode');

  if (opponentName.length > 0) {
    compareGroup.classList.remove('hidden-group');
    compareModeSelect.disabled = false;
  } else {
    compareGroup.classList.add('hidden-group');
    compareModeSelect.disabled = true;
    compareModeSelect.value = 'direct';
  }
  handleCompareModeChange();
  saveUiSettings();
}

function toggleFilterInput() {
  const mode = document.getElementById('filter-mode').value;
  const container = document.getElementById('filter-val-container');
  const input = document.getElementById('filter-val');
  const label = document.getElementById('filter-label');
  if (mode === 'all') {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'flex';
  label.innerText = mode === 'matches' ? 'Amount (Matches)' : 'Days';

  const min = mode === 'matches' ? 1 : 1;
  const max = mode === 'matches' ? MAX_MATCHES : 3650;
  input.min = min;
  input.max = max;
  input.step = mode === 'matches' ? 1 : 1;
  const value = parseInt(input.value, 10);
  if (!Number.isFinite(value) || value < min || value > max) {
    input.value = mode === 'matches' ? 50 : 14;
  }
  saveUiSettings();
}

function toggleAdvancedSettings() {
  const panel = document.getElementById('adv-panel');
  const toggleBtn = document.getElementById('adv-toggle-btn');
  const isOpen = panel.classList.contains('open');

  if (!isOpen) {
    tempAdvancedState = {
      filterMode: document.getElementById('filter-mode').value,
      filterVal: document.getElementById('filter-val').value
    };
    panel.classList.add('open');
    toggleBtn.classList.add('open');
  } else {
    closeAdvancedSettings(false);
  }
}

function closeAdvancedSettings(apply) {
  const panel = document.getElementById('adv-panel');
  const toggleBtn = document.getElementById('adv-toggle-btn');

  if (!apply && tempAdvancedState) {
    document.getElementById('filter-mode').value = tempAdvancedState.filterMode;
    document.getElementById('filter-val').value = tempAdvancedState.filterVal;
    toggleFilterInput();
    handleOpponentInput();
  }

  tempAdvancedState = null;
  panel.classList.remove('open');
  toggleBtn.classList.remove('open');

  if (apply) {
    handleOpponentInput();
    saveUiSettings();
    reRenderCurrentStats();
  }
}

function reloadNewChanges() {
  runAnalysis(true);
}

function showStatus(msg, type) {
  const box = document.getElementById('status-box');
  box.className = `status-msg ${type}`;
  box.innerText = msg;
}

function formatName(str) {
  if (!str || str.toLowerCase() === 'unknown') return null;
  return str.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatTime(ms) {
  if (!ms || isNaN(ms)) return 'N/A';
  const totalSec = Math.floor(ms / 1000);
  return `${Math.floor(totalSec / 60)}m ${(totalSec % 60).toString().padStart(2, '0')}s`;
}

function calculateSplitStats(arr) {
  if (!arr || arr.length === 0) return { mean: 0, median: 0 };
  const s = [...arr].sort((a, b) => a - b);
  const sum = s.reduce((acc, val) => acc + val, 0);
  const mean = sum / s.length;
  const mid = Math.floor(s.length / 2);
  const median = s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  return { mean, median };
}

async function fetchPlayerMatches(username, filterMode, filterVal, opponentUuid, compareMode, bypassCache) {
  const userRes = await fetch(`${BASE_URL}/users/${username}`);
  trackRequest(1);
  if (!userRes.ok) {
    if (userRes.status === 429 && compareMode === 'compare') {
      throw new Error("limit exceeded");
    }
    throw new Error("The player has not played recently.");
  }

  const userData = (await userRes.json()).data;
  const userUuid = userData.uuid;

  let allMatches = [];
  let pageCursor = undefined;

  let targetMatchCount = MAX_MATCHES;
  if (filterMode === 'matches') {
    targetMatchCount = Math.min(filterVal, MAX_MATCHES);
  }

  const cutoffTimestamp = filterMode === 'days' ? (Date.now() / 1000) - (filterVal * 86400) : 0;

  while (allMatches.length < targetMatchCount) {
    if (requestTimestamps.length >= API_WINDOW_LIMIT - API_SAFETY_RESERVE) {
      if (compareMode === 'compare') {
        throw new Error("limit exceeded");
      }
      break;
    }

    const url = `${BASE_URL}/users/${username}/matches?count=100&type=2${pageCursor ? '&before=' + pageCursor : ''}`;
    const mRes = await fetch(url, { cache: 'no-cache' });
    trackRequest(1);

    if (!mRes.ok) {
      if (mRes.status === 429 && compareMode === 'compare') {
        throw new Error("limit exceeded");
      }
      break;
    }
    
    const batch = (await mRes.json()).data || [];
    if (batch.length === 0) break;

    let reachedCutoff = false;
    for (const match of batch) {
      if (match.type !== 2) continue; // Ranked games only
      if (filterMode === 'days' && match.date < cutoffTimestamp) {
        reachedCutoff = true;
        break;
      }
      if (opponentUuid && compareMode === 'direct') {
        const hasOpponent = match.members?.some(m => m.uuid === opponentUuid) || match.players?.some(p => p.uuid === opponentUuid);
        if (!hasOpponent) continue;
      }
      allMatches.push(match);
      if (allMatches.length >= targetMatchCount) break;
    }

    if (reachedCutoff || batch.length < 100) break;
    pageCursor = batch[batch.length - 1].id;
  }

  const detailedMatches = [];
  const uncachedChunk = [];

  for (const match of allMatches) {
    const dbCached = bypassCache ? null : await getCachedMatchDB(match.id);
    if (dbCached) detailedMatches.push(dbCached);
    else uncachedChunk.push(match);
  }

  if (uncachedChunk.length > 0) {
    const chunkSize = 15;
    for (let i = 0; i < uncachedChunk.length; i += chunkSize) {
      if (requestTimestamps.length >= API_WINDOW_LIMIT - API_SAFETY_RESERVE) {
        if (compareMode === 'compare') {
          throw new Error("limit exceeded");
        }
        break;
      }
      const chunk = uncachedChunk.slice(i, i + chunkSize);
      const results = await Promise.all(
        chunk.map(m => fetch(`${BASE_URL}/matches/${m.id}`).then(r => {
          if (r.status === 429 && compareMode === 'compare') {
            throw new Error("limit exceeded");
          }
          return r.json();
        }).then(j => {
          if (j.data) saveCachedMatchDB(m.id, j.data);
          return j.data;
        }).catch((err) => {
          if (err.message === "limit exceeded") throw err;
          return null;
        }))
      );
      trackRequest(chunk.length);
      results.forEach(res => { if (res) detailedMatches.push(res); });
    }
  }

  return { userData, detailedMatches };
}

async function runAnalysis(forceReload = false) {
  cleanRequestLogs();
  const username = document.getElementById('username').value.trim();
  const opponentName = document.getElementById('opponent').value.trim();
  let compareMode = document.getElementById('compare-mode').value;
  let filterMode = document.getElementById('filter-mode').value;
  const rawFilterVal = parseInt(document.getElementById('filter-val').value, 10);
  const filterVal = Math.max(1, Math.min(filterMode === 'matches' ? MAX_MATCHES : 3650, Number.isFinite(rawFilterVal) ? rawFilterVal : (filterMode === 'matches' ? 50 : 14)));
  const bypassCache = forceReload;
  const btn = document.getElementById('search-btn');

  if (compareMode === 'compare' && filterMode === 'matches') {
    filterMode = 'days';
    document.getElementById('filter-mode').value = 'days';
    toggleFilterInput();
  }

  if (!username) {
    showStatus("Please enter a valid MCSR player name or UUID.", "error");
    return;
  }

  btn.disabled = true;
  showStatus(`Analyzing performance for '${username}'${forceReload ? ' (Reloading new changes...)' : ''}...`, "info");

  try {
    let opponentUuid = null;
    let opponentUserData = null;
    if (opponentName) {
      const oppRes = await fetch(`${BASE_URL}/users/${opponentName}`);
      trackRequest(1);
      if (!oppRes.ok) {
        if (oppRes.status === 429 && compareMode === 'compare') {
          throw new Error("limit exceeded");
        }
        throw new Error("The player has not played recently.");
      }
      opponentUserData = (await oppRes.json()).data;
      opponentUuid = opponentUserData.uuid;
    }

    const primaryData = await fetchPlayerMatches(username, filterMode, filterVal, opponentUuid, compareMode, bypassCache);
    
    if (!primaryData || primaryData.detailedMatches.length === 0) {
      throw new Error("The player has not played recently.");
    }

    updateRecentSearches(primaryData.userData.nickname);

    let secondaryData = null;
    if (opponentName && compareMode === 'compare') {
      showStatus(`Fetching comparison metrics for opponent '${opponentName}'...`, "info");
      secondaryData = await fetchPlayerMatches(opponentName, filterMode, filterVal, null, 'compare', bypassCache);
      if (!secondaryData || secondaryData.detailedMatches.length === 0) {
        throw new Error("The player has not played recently.");
      }
    }

    const primaryStats = processStats(primaryData.detailedMatches, primaryData.userData.uuid, primaryData.userData.eloRate, primaryData.userData.nickname);
    const secondaryStats = secondaryData ? processStats(secondaryData.detailedMatches, secondaryData.userData.uuid, secondaryData.userData.eloRate, secondaryData.userData.nickname) : null;

    currentDataState = {
      userData: primaryData.userData,
      stats: primaryStats,
      matchesRaw: primaryData.detailedMatches,
      matchCount: primaryData.detailedMatches.length,
      opponentData: secondaryData ? secondaryData.userData : opponentUserData,
      opponentStats: secondaryStats,
      opponentName: opponentName || null,
      opponentUuid: opponentUuid,
      compareMode
    };

    renderResults();
    showStatus(`Analysis complete! (${primaryData.detailedMatches.length} games analyzed)`, "info");

  } catch (err) {
    if (err.message === "limit exceeded" || err.message === "Limit exceeded") {
      showStatus("limit exceeded", "error");
    } else {
      showStatus(err.message.includes("played") ? err.message : `The player has not played recently.`, "error");
    }
  } finally {
    btn.disabled = false;
    cleanRequestLogs();
  }
}

function processStats(matches, userUuid, currentProfileElo, userNickname) {
  const initCat = () => ({ total: 0, wins: 0, draws: 0, elo: 0, nether: 0, end: 0, splits: {} });
  const data = {
    overall: initCat(),
    overworld: {},
    bastion: {},
    combo: {},
    seedMatrix: {},
    eloHistory: [],
    streaks: { current: 0, maxWin: 0, maxLoss: 0 }
  };

  const chronMatches = [...matches].sort((a, b) => a.date - b.date);

  let netEloSum = 0;
  chronMatches.forEach(m => {
    const change = m.changes?.find(c => c.uuid === userUuid)?.change || 0;
    netEloSum += change;
  });

  let runningElo = (currentProfileElo || 1000) - netEloSum;
  let curWin = 0, curLoss = 0;

  chronMatches.forEach((m, index) => {
    const isWinner = m.result?.uuid === userUuid;
    const isDraw = !m.result?.uuid;
    const isLoss = m.result?.uuid && m.result?.uuid !== userUuid;

    const changeObj = m.changes?.find(c => c.uuid === userUuid);
    const eloChange = changeObj?.change || 0;

    if (changeObj && changeObj.eloRate !== undefined && changeObj.eloRate !== null) {
      runningElo = changeObj.eloRate;
    } else {
      runningElo += eloChange;
    }

    const rawTimelines = Array.isArray(m.timelines) ? m.timelines : [];
    const userTimelines = rawTimelines.filter(t => t && t.uuid === userUuid);
    const times = {};
    userTimelines.forEach(t => { if (t && t.type) times[t.type] = t.time; });

    const members = m.members || m.players || [];
    const oppObj = members.find(p => p.uuid !== userUuid);
    const oppName = oppObj ? (oppObj.nickname || oppObj.uuid) : 'Opponent';
    const winnerName = isWinner ? userNickname : (isDraw ? 'Draw' : oppName);

    const owName = formatName(m.seed?.overworld);
    const bastionName = formatName(m.seed?.nether);

    data.eloHistory.push({
      matchIndex: index + 1,
      date: m.date,
      change: eloChange,
      elo: runningElo,
      isDecay: !!m.decayed,
      winnerUuid: m.result?.uuid,
      winnerName: winnerName,
      opponentName: oppName,
      opponentUuid: oppObj ? oppObj.uuid : null,
      duration: m.result?.time,
      overworld: owName,
      bastion: bastionName,
      times: times
    });

    if (isWinner) {
      curWin++; curLoss = 0;
      if (curWin > data.streaks.maxWin) data.streaks.maxWin = curWin;
    } else if (isLoss) {
      curLoss++; curWin = 0;
      if (curLoss > data.streaks.maxLoss) data.streaks.maxLoss = curLoss;
    } else if (isDraw) {
      curWin = 0; curLoss = 0;
    }
  });

  data.streaks.current = curWin > 0 ? curWin : (curLoss > 0 ? -curLoss : 0);

  matches.forEach(m => {
    const isWinner = m.result?.uuid === userUuid;
    const isDraw = !m.result?.uuid;
    const eloChange = m.changes?.find(c => c.uuid === userUuid)?.change || 0;
    const ow = formatName(m.seed?.overworld);
    const bastion = formatName(m.seed?.nether);

    const rawTimelines = Array.isArray(m.timelines) ? m.timelines : [];
    const timelines = rawTimelines.filter(t => t && t.uuid === userUuid);
    const times = {};
    timelines.forEach(t => { if (t && t.type) times[t.type] = t.time; });

    const reachedNether = !!times['story.enter_the_nether'];
    const reachedEnd = !!times['story.enter_the_end'];

    if (ow && bastion) {
      if (!data.seedMatrix[ow]) data.seedMatrix[ow] = {};
      if (!data.seedMatrix[ow][bastion]) {
        data.seedMatrix[ow][bastion] = { total: 0, wins: 0, draws: 0, splits: {} };
      }
      const cell = data.seedMatrix[ow][bastion];
      cell.total++;
      if (isWinner) cell.wins++;
      else if (isDraw) cell.draws++;

      Object.entries(times).forEach(([splitKey, timeVal]) => {
        if (TRACKED_SPLITS[splitKey]) {
          if (!cell.splits[splitKey]) cell.splits[splitKey] = [];
          cell.splits[splitKey].push(timeVal);
        }
      });
    }

    const record = (group, key) => {
      if (!key) return;
      if (!data[group][key]) data[group][key] = initCat();
      const obj = data[group][key];
      obj.total++;
      if (isWinner) obj.wins++;
      else if (isDraw) obj.draws++;
      
      obj.elo += eloChange;
      if (reachedNether) obj.nether++;
      if (reachedEnd) obj.end++;

      Object.entries(times).forEach(([split, time]) => {
        if (TRACKED_SPLITS[split]) {
          if (!obj.splits[split]) obj.splits[split] = [];
          obj.splits[split].push(time);
        }
      });
    };

    record('overall', 'all');
    if (ow) record('overworld', ow);
    if (reachedNether && bastion) {
      record('bastion', bastion);
    }
    if (reachedNether && ow && bastion) {
      record('combo', `${ow} + ${bastion}`);
    }
  });

  return data;
}

function reRenderCurrentStats() {
  if (currentDataState) renderResults();
}

function createTimeMapper(primaryHistory, secondaryHistory) {
  const isCompare = secondaryHistory && secondaryHistory.length > 0;
  const allDates = primaryHistory.map(h => h.date).concat(isCompare ? secondaryHistory.map(h => h.date) : []);
  if (allDates.length === 0) return null;

  const minDate = Math.min(...allDates);
  const maxDate = Math.max(...allDates);
  const totalDuration = maxDate - minDate;

  if (totalDuration === 0) {
    return {
      minDate, maxDate,
      getX: () => 0.5,
      getTime: () => minDate
    };
  }

  const uniqueDates = Array.from(new Set(allDates)).sort((a, b) => a - b);
  
  const intervals = [];
  let cumWeight = 0;
  const gamma = 0.35;

  for (let i = 0; i < uniqueDates.length - 1; i++) {
    const dt = uniqueDates[i + 1] - uniqueDates[i];
    const w = Math.pow(dt, gamma);
    intervals.push({ t0: uniqueDates[i], t1: uniqueDates[i + 1], dt, w, startW: cumWeight });
    cumWeight += w;
  }

  const totalWeight = cumWeight || 1;

  function getX(t) {
    if (t <= minDate) return 0;
    if (t >= maxDate) return 1;

    let low = 0, high = intervals.length - 1;
    while (low <= high) {
      const mid = Math.floor((low + high) / 2);
      const inter = intervals[mid];
      if (t >= inter.t0 && t <= inter.t1) {
        const r = inter.dt > 0 ? (t - inter.t0) / inter.dt : 0;
        const wVal = inter.startW + r * inter.w;
        return wVal / totalWeight;
      } else if (t < inter.t0) {
        high = mid - 1;
      } else {
        low = mid + 1;
      }
    }
    return (t - minDate) / totalDuration;
  }

  function getTime(normX) {
    const targetW = Math.max(0, Math.min(1, normX)) * totalWeight;
    for (let i = 0; i < intervals.length; i++) {
      const inter = intervals[i];
      if (targetW >= inter.startW && targetW <= inter.startW + inter.w) {
        const r = inter.w > 0 ? (targetW - inter.startW) / inter.w : 0;
        return inter.t0 + r * inter.dt;
      }
    }
    return minDate + normX * totalDuration;
  }

  return { minDate, maxDate, getX, getTime };
}

function interpolateLinePoint(pts, targetX) {
  if (!pts || pts.length === 0) return { x: targetX, y: 0, elo: 0, match: null };
  if (targetX <= pts[0].x) return { x: targetX, y: pts[0].y, elo: pts[0].elo, match: pts[0].match, date: pts[0].date };
  if (targetX >= pts[pts.length - 1].x) {
    const last = pts[pts.length - 1];
    return { x: targetX, y: last.y, elo: last.elo, match: last.match, date: last.date };
  }
  for (let i = 0; i < pts.length - 1; i++) {
    if (targetX >= pts[i].x && targetX <= pts[i + 1].x) {
      const dx = pts[i + 1].x - pts[i].x;
      const t = dx > 0 ? (targetX - pts[i].x) / dx : 0;
      const y = pts[i].y + t * (pts[i + 1].y - pts[i].y);
      const elo = Math.round(pts[i].elo + t * (pts[i + 1].elo - pts[i].elo));
      const match = t < 0.5 ? pts[i].match : pts[i + 1].match;
      const date = pts[i].date ? (pts[i].date + t * ((pts[i + 1].date || pts[i].date) - pts[i].date)) : null;
      return { x: targetX, y, elo, match, date };
    }
  }
  return { x: targetX, y: pts[0].y, elo: pts[0].elo, match: pts[0].match, date: pts[0].date };
}

function getRankForElo(elo) {
  for (let i = MCSR_RANKS.length - 1; i >= 0; i--) {
    if (elo >= MCSR_RANKS[i].min) return MCSR_RANKS[i];
  }
  return MCSR_RANKS[0];
}

function renderEloChart(primaryHistory, secondaryHistory = null, primaryName = 'Player 1', secondaryName = 'Player 2', isTimeAccurate = false) {
  if (!primaryHistory || primaryHistory.length === 0) return '';

  const isCompareMode = secondaryHistory && secondaryHistory.length > 0;

  let allEloVals = primaryHistory.map(h => h.elo);
  if (isCompareMode) {
    allEloVals = allEloVals.concat(secondaryHistory.map(h => h.elo));
  }

  const rawMin = Math.min(...allEloVals);
  const rawMax = Math.max(...allEloVals);

  let niceMin = Math.floor(rawMin / 100) * 100;
  let niceMax = Math.ceil(rawMax / 100) * 100;
  if (niceMax === niceMin) { niceMin -= 100; niceMax += 100; }
  const niceRange = niceMax - niceMin || 1;

  const leftMargin = 55;
  const graphWidth = 525;
  const bottomY = 190;
  const topY = 15;
  const graphHeight = bottomY - topY;

  const getYPos = (elo) => bottomY - (((elo - niceMin) / niceRange) * graphHeight);

  let pointsPrimary = '';
  let pointsSecondary = '';
  let startLabel = '';
  let midLabel = '';
  let endLabel = '';

  let mapper = null;
  let p1PointsList = [];
  let p2PointsList = [];

  if (isTimeAccurate) {
    mapper = createTimeMapper(primaryHistory, secondaryHistory);
    const getXPosByDate = (d) => leftMargin + mapper.getX(d) * graphWidth;

    const sortedP1 = [...primaryHistory].sort((a, b) => a.date - b.date);
    if (sortedP1.length > 0) {
      const firstX = getXPosByDate(sortedP1[0].date);
      const lastX = getXPosByDate(sortedP1[sortedP1.length - 1].date);
      const firstY = getYPos(sortedP1[0].elo);
      const lastY = getYPos(sortedP1[sortedP1.length - 1].elo);

      if (firstX > leftMargin) {
        p1PointsList.push({ x: leftMargin, y: firstY, elo: sortedP1[0].elo, match: sortedP1[0], date: sortedP1[0].date });
      }

      sortedP1.forEach(h => {
        p1PointsList.push({ x: getXPosByDate(h.date), y: getYPos(h.elo), elo: h.elo, match: h, date: h.date });
      });

      if (lastX < leftMargin + graphWidth) {
        p1PointsList.push({ x: leftMargin + graphWidth, y: lastY, elo: sortedP1[sortedP1.length - 1].elo, match: sortedP1[sortedP1.length - 1], date: sortedP1[sortedP1.length - 1].date });
      }
    }
    pointsPrimary = p1PointsList.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

    if (isCompareMode && secondaryHistory) {
      const sortedP2 = [...secondaryHistory].sort((a, b) => a.date - b.date);
      if (sortedP2.length > 0) {
        const firstX = getXPosByDate(sortedP2[0].date);
        const lastX = getXPosByDate(sortedP2[sortedP2.length - 1].date);
        const firstY = getYPos(sortedP2[0].elo);
        const lastY = getYPos(sortedP2[sortedP2.length - 1].elo);

        if (firstX > leftMargin) {
          p2PointsList.push({ x: leftMargin, y: firstY, elo: sortedP2[0].elo, match: sortedP2[0], date: sortedP2[0].date });
        }

        sortedP2.forEach(h => {
          p2PointsList.push({ x: getXPosByDate(h.date), y: getYPos(h.elo), elo: h.elo, match: h, date: h.date });
        });

        if (lastX < leftMargin + graphWidth) {
          p2PointsList.push({ x: leftMargin + graphWidth, y: lastY, elo: sortedP2[sortedP2.length - 1].elo, match: sortedP2[sortedP2.length - 1], date: sortedP2[sortedP2.length - 1].date });
        }
      }
      pointsSecondary = p2PointsList.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    }

    startLabel = new Date(mapper.minDate * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    midLabel = 'Timeline';
    endLabel = new Date(mapper.maxDate * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  } else {
    const sortedP1 = [...primaryHistory].sort((a, b) => a.date - b.date);
    const n1 = sortedP1.length;
    const getXPosP1 = (i) => leftMargin + (n1 > 1 ? (i / (n1 - 1)) * graphWidth : graphWidth / 2);
    
    sortedP1.forEach((h, i) => {
      p1PointsList.push({ x: getXPosP1(i), y: getYPos(h.elo), elo: h.elo, match: h, date: h.date });
    });
    pointsPrimary = p1PointsList.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

    if (isCompareMode && secondaryHistory) {
      const sortedP2 = [...secondaryHistory].sort((a, b) => a.date - b.date);
      const n2 = sortedP2.length;
      const getXPosP2 = (j) => leftMargin + (n2 > 1 ? (j / (n2 - 1)) * graphWidth : graphWidth / 2);
      
      sortedP2.forEach((h, j) => {
        p2PointsList.push({ x: getXPosP2(j), y: getYPos(h.elo), elo: h.elo, match: h, date: h.date });
      });
      pointsSecondary = p2PointsList.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    }

    startLabel = 'Match 1';
    midLabel = 'Match Sequence';
    endLabel = `Match ${Math.max(primaryHistory.length, isCompareMode ? secondaryHistory.length : 0)}`;
  }

  if (currentDataState) {
    currentDataState.chartConfig = {
      isTimeAccurate,
      timeMapper: mapper,
      pointsP1: p1PointsList,
      pointsP2: p2PointsList
    };
  }

  const yTicks = [];
  for (let i = 0; i <= 4; i++) {
    const val = Math.round(niceMin + (i * niceRange / 4));
    const y = getYPos(val);
    yTicks.push({ val, y });
  }

  const visibleRanks = MCSR_RANKS.filter(r => r.min >= niceMin && r.min <= niceMax);

  const p1LastElo = primaryHistory[primaryHistory.length - 1].elo;
  const p1Rank = getRankForElo(p1LastElo);
  const p2LastElo = isCompareMode ? secondaryHistory[secondaryHistory.length - 1].elo : null;
  const p2Rank = isCompareMode ? getRankForElo(p2LastElo) : null;

  const chartTitle = "ELO Chart";

  let areaPrimary = '';
  if (p1PointsList.length > 0) {
    areaPrimary = `${p1PointsList[0].x},${bottomY} ${pointsPrimary} ${p1PointsList[p1PointsList.length - 1].x},${bottomY}`;
  }

  let areaSecondary = '';
  if (isCompareMode && p2PointsList.length > 0) {
    areaSecondary = `${p2PointsList[0].x},${bottomY} ${pointsSecondary} ${p2PointsList[p2PointsList.length - 1].x},${bottomY}`;
  }

  return `
    <div class="chart-card" id="section-elo-chart">
      <div class="chart-header">
        <span>${chartTitle}</span>
        <div class="chart-legend">
          <span class="legend-pill">
            <span class="legend-dot" style="background:var(--color-primary)"></span>
            <span>${primaryName} (${p1LastElo} ELO - ${p1Rank.name})</span>
          </span>
          ${isCompareMode ? `
            <span class="legend-pill">
              <span class="legend-dot" style="background:var(--color-secondary)"></span>
              <span>${secondaryName} (${p2LastElo} ELO - ${p2Rank.name})</span>
            </span>
          ` : ''}
        </div>
      </div>
      <div class="graph-container" id="elo-graph-box" onmousemove="handleChartHover(event)" onmouseleave="hideChartHover()">
        <div id="chart-tooltip" class="chart-tooltip"></div>
        <svg class="elo-chart" viewBox="0 0 600 230">
          <defs>
            <linearGradient id="primary-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--color-primary)" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0.0"/>
            </linearGradient>
            <linearGradient id="secondary-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--color-secondary)" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="var(--color-secondary)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>

          <!-- Standard Grid Lines -->
          <g class="graph-grid">
            ${yTicks.map(t => `<line x1="${leftMargin}" y1="${t.y}" x2="${leftMargin + graphWidth}" y2="${t.y}" />`).join('')}
          </g>

          <!-- MCSR Rank Reference Lines -->
          <g class="rank-lines">
            ${visibleRanks.map(r => {
              const ry = getYPos(r.min);
              return `
                <line class="rank-line" x1="${leftMargin}" y1="${ry}" x2="${leftMargin + graphWidth}" y2="${ry}" stroke="${r.color}" />
                <text class="rank-text" x="${leftMargin + graphWidth - 5}" y="${ry - 3}" fill="${r.color}">${r.name}</text>
              `;
            }).join('')}
          </g>

          <!-- Axis Bars -->
          <line class="axis-bar" x1="${leftMargin}" y1="${topY}" x2="${leftMargin}" y2="${bottomY}" />
          <line class="axis-bar" x1="${leftMargin}" y1="${bottomY}" x2="${leftMargin + graphWidth}" y2="${bottomY}" />

          <!-- Axis Labels -->
          <g class="graph-axis">
            ${yTicks.map(t => `<text x="${leftMargin - 8}" y="${t.y + 4}">${t.val}</text>`).join('')}
          </g>

          <g class="graph-axis graph-axis-x">
            <text x="${leftMargin}" y="215">${startLabel}</text>
            <text x="${leftMargin + (graphWidth / 2)}" y="215">${midLabel}</text>
            <text x="${leftMargin + graphWidth}" y="215">${endLabel}</text>
          </g>

          ${areaPrimary ? `<polygon class="chart-area" points="${areaPrimary}" />` : ''}
          ${areaSecondary ? `<polygon class="chart-area secondary-area" points="${areaSecondary}" />` : ''}

          <polyline class="chart-line" points="${pointsPrimary}" />
          ${isCompareMode ? `<polyline class="chart-line secondary-line" points="${pointsSecondary}" />` : ''}

          <line id="hover-crosshair" class="hover-line" x1="0" y1="${topY}" x2="0" y2="${bottomY}" style="display:none;" />
          <circle id="hover-dot-1" class="hover-dot primary" r="4.5" cx="0" cy="0" style="display:none;" />
          <circle id="hover-dot-2" class="hover-dot secondary" r="4.5" cx="0" cy="0" style="display:none;" />
        </svg>
      </div>
    </div>`;
}

function handleChartHover(e) {
  if (!currentDataState || !currentDataState.stats.eloHistory) return;
  const primaryHistory = currentDataState.stats.eloHistory;
  const secondaryHistory = currentDataState.opponentStats?.eloHistory;
  const isCompare = secondaryHistory && secondaryHistory.length > 0;
  const config = currentDataState.chartConfig || { isTimeAccurate: false };

  const box = document.getElementById('elo-graph-box');
  if (!box) return;
  const rect = box.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;

  const svgX = Math.max(55, Math.min(580, (mouseX / rect.width) * 600));

  const leftMargin = 55;
  const graphWidth = 525;
  const bottomY = 190;
  const topY = 15;
  const graphHeight = bottomY - topY;

  let allEloVals = primaryHistory.map(h => h.elo);
  if (isCompare) allEloVals = allEloVals.concat(secondaryHistory.map(h => h.elo));

  let niceMin = Math.floor(Math.min(...allEloVals) / 100) * 100;
  let niceMax = Math.ceil(Math.max(...allEloVals) / 100) * 100;
  if (niceMax === niceMin) { niceMin -= 100; niceMax += 100; }
  const niceRange = niceMax - niceMin || 1;

  const crosshair = document.getElementById('hover-crosshair');
  const dot1 = document.getElementById('hover-dot-1');
  const dot2 = document.getElementById('hover-dot-2');
  const tooltip = document.getElementById('chart-tooltip');

  crosshair.setAttribute('x1', svgX);
  crosshair.setAttribute('x2', svgX);
  crosshair.style.display = 'block';

  if (config.isTimeAccurate && config.pointsP1 && config.pointsP1.length > 0) {
    const p1Interp = interpolateLinePoint(config.pointsP1, svgX);
    dot1.setAttribute('cx', svgX);
    dot1.setAttribute('cy', p1Interp.y);
    dot1.style.display = 'block';

    let p2Interp = null;
    if (isCompare && config.pointsP2 && config.pointsP2.length > 0) {
      p2Interp = interpolateLinePoint(config.pointsP2, svgX);
      dot2.setAttribute('cx', svgX);
      dot2.setAttribute('cy', p2Interp.y);
      dot2.style.display = 'block';
    } else if (dot2) {
      dot2.style.display = 'none';
    }

    const hoverDate = p1Interp.date ? new Date(p1Interp.date * 1000) : (config.timeMapper ? new Date(config.timeMapper.getTime((svgX - leftMargin) / graphWidth) * 1000) : null);
    const dateOrMatchStr = hoverDate ? hoverDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Timeline';

    const p1Rank = getRankForElo(p1Interp.elo);
    let html = `<div style="margin-bottom:4px;"><span style="color:var(--text-muted); font-size:0.72rem; font-weight:600;">${dateOrMatchStr}</span></div>`;

    if (isCompare && p2Interp) {
      const p2Rank = getRankForElo(p2Interp.elo);
      html += `<span style="color:var(--color-primary)"><strong>${currentDataState.userData.nickname}:</strong> ${p1Interp.elo} ELO (${p1Rank.name})</span><br>`;
      html += `<span style="color:var(--color-secondary)"><strong>${currentDataState.opponentData.nickname}:</strong> ${p2Interp.elo} ELO (${p2Rank.name})</span>`;
    } else {
      html += `<span style="color:var(--color-primary)"><strong>${currentDataState.userData.nickname}:</strong> ${p1Interp.elo} ELO (${p1Rank.name})</span><br>`;
      if (p1Interp.match) {
        if (p1Interp.match.isDecay) {
          html += `<span style="color:var(--danger)"><strong>ELO Decay</strong></span><br>`;
        } else if (p1Interp.match.opponentName) {
          html += `VS <strong>${p1Interp.match.opponentName}</strong> &bull; Winner: <strong style="color:var(--color-tertiary)">${p1Interp.match.winnerName}</strong><br>`;
        }
        if (p1Interp.match.overworld || p1Interp.match.bastion) {
          html += `<span style="color:var(--text-muted)">Seed: ${p1Interp.match.overworld || 'N/A'} / ${p1Interp.match.bastion || 'N/A'}</span><br>`;
        }
        if (p1Interp.match.duration) html += `<span style="color:var(--color-tertiary)">Duration: ${formatTime(p1Interp.match.duration)}</span>`;
      }
    }

    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    return;
  }

  let pMatch = null;
  let sMatch = null;
  let xPosP1 = leftMargin;
  let xPosP2 = leftMargin;
  let dateOrMatchStr = '';

  const normX = Math.max(0, Math.min(1, (svgX - leftMargin) / graphWidth));
  const pIndex = Math.min(primaryHistory.length - 1, Math.max(0, Math.round(normX * (primaryHistory.length - 1))));
  pMatch = primaryHistory[pIndex];
  xPosP1 = leftMargin + (primaryHistory.length > 1 ? (pIndex / (primaryHistory.length - 1)) * graphWidth : graphWidth / 2);

  if (isCompare) {
    const sIndex = Math.min(secondaryHistory.length - 1, Math.max(0, Math.round(normX * (secondaryHistory.length - 1))));
    sMatch = secondaryHistory[sIndex];
    xPosP2 = leftMargin + (secondaryHistory.length > 1 ? (sIndex / (secondaryHistory.length - 1)) * graphWidth : graphWidth / 2);
  }

  dateOrMatchStr = `Match #${pMatch.matchIndex || (pIndex + 1)} (${new Date(pMatch.date * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })})`;

  const yPosP1 = bottomY - (((pMatch.elo - niceMin) / niceRange) * graphHeight);
  dot1.setAttribute('cx', xPosP1);
  dot1.setAttribute('cy', yPosP1);
  dot1.style.display = 'block';

  if (isCompare && sMatch) {
    const yPosP2 = bottomY - (((sMatch.elo - niceMin) / niceRange) * graphHeight);
    dot2.setAttribute('cx', xPosP2);
    dot2.setAttribute('cy', yPosP2);
    dot2.style.display = 'block';
  } else if (dot2) {
    dot2.style.display = 'none';
  }

  const p1Rank = getRankForElo(pMatch.elo);
  let html = `<div style="margin-bottom:4px;"><span style="color:var(--text-muted); font-size:0.72rem; font-weight:600;">${dateOrMatchStr}</span></div>`;

  if (isCompare && sMatch) {
    const p2Rank = getRankForElo(sMatch.elo);
    html += `<span style="color:var(--color-primary)"><strong>${currentDataState.userData.nickname}:</strong> ${pMatch.elo} ELO (${p1Rank.name}) (${pMatch.change >= 0 ? '+' : ''}${pMatch.change})</span><br>`;
    html += `<span style="color:var(--color-secondary)"><strong>${currentDataState.opponentData.nickname}:</strong> ${sMatch.elo} ELO (${p2Rank.name}) (${sMatch.change >= 0 ? '+' : ''}${sMatch.change})</span>`;
  } else {
    html += `<span style="color:var(--color-primary)"><strong>${currentDataState.userData.nickname}:</strong> ${pMatch.elo} ELO (${p1Rank.name}) (${pMatch.change >= 0 ? '+' : ''}${pMatch.change})</span><br>`;
    if (pMatch.isDecay) {
      html += `<span style="color:var(--danger)"><strong>ELO Decay</strong></span><br>`;
    } else {
      html += `VS <strong>${pMatch.opponentName}</strong> &bull; Winner: <strong style="color:var(--color-tertiary)">${pMatch.winnerName}</strong><br>`;
    }
    if (pMatch.overworld || pMatch.bastion) {
      html += `<span style="color:var(--text-muted)">Seed: ${pMatch.overworld || 'N/A'} / ${pMatch.bastion || 'N/A'}</span><br>`;
    }
    if (pMatch.duration) html += `<span style="color:var(--color-tertiary)">Duration: ${formatTime(pMatch.duration)}</span>`;
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
}

function hideChartHover() {

  const dot1 = document.getElementById('hover-dot-1');

  const tooltip = document.getElementById('chart-tooltip');

  if (crosshair) crosshair.style.display = 'none';
